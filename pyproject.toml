[project]
name = "eventops"
version = "0.1.0"
description = "EventOps: herramientas y plataforma ligera para operaciones y eventos"
requires-python = ">=3.12"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
